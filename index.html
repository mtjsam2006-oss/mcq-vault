  /* ---------- tool output ---------- */
  function outHTML(){const X=FX(),o=X.out;if(!o)return'';
    const shell=(t,body,save)=>`<div class="panel fxout" id="fxout"><div class="spread"><h3>${esc(t)}</h3><div class="row" style="gap:6px">${save?`<button class="btn sm pri" data-f="save">Save to notebook</button>`:''}<button class="btn sm ghost" data-f="closeout">Close</button></div></div>${body}</div>`;
    if(o.kind==='loading')return shell(o.t,`<div class="empty"><h3>Claude is reading the pages\u2026</h3><p class="small">This takes 10 to 40 seconds.</p></div>`);
    if(o.kind==='err')return shell(o.t,`<div class="notice bad">${esc(o.msg)}</div>`);
    if(o.kind==='keys')return shell('Key points',keysHTML(o.data),!o.saved);
    if(o.kind==='map')return shell('Concept map',mapSVG(o.data)+`<p class="small muted">Words that appear together with what you searched. Tap one to search both together.</p>`,!o.saved);
    if(o.kind==='cards'||o.kind==='run'){const c=o.data.cards,i=o.i||0,card=c[i];if(!card)return shell('Flashcards','<p class="muted">No cards could be made from these pages. Try another passage.</p>');
      return shell(o.kind==='run'?'Review: '+(o.title||''):'Flashcards',`<div class="fxcard ${o.show?'show':''}"><p class="small muted">Card ${i+1} of ${c.length}${o.got?` \u00b7 ${o.got} known`:''}</p><p class="fxfront">${esc(card.f)}</p>
        ${o.show?`<p class="fxans">${esc(card.b)}</p><p class="small muted">${esc(card.s)}</p>`:''}</div>
        <div class="row" style="justify-content:flex-end">${o.show?`<button class="btn" data-f="card" data-k="again">Again</button><button class="btn pri" data-f="card" data-k="got">I knew it</button>`:`<button class="btn pri" data-f="card" data-k="show">Show answer</button>`}</div>`,o.kind==='cards'&&!o.saved)}
    if(o.kind==='sketch')return shell('Sketch pad',`<div class="row fxpens">${['#141821','#C2392B','#2F5FD0','#1F7A4D','#B87A00'].map((c,i)=>`<button class="fxpen ${(o.pen||'#141821')===c?'on':''}" data-f="pen" data-k="${c}" style="background:${c}" aria-label="Pen colour ${i+1}"></button>`).join('')}
        <button class="btn sm ${o.pen==='erase'?'pri':''}" data-f="pen" data-k="erase">Eraser</button><select id="fxsize" aria-label="Pen size"><option value="2">Fine</option><option value="4" selected>Medium</option><option value="8">Thick</option></select><button class="btn sm" data-f="skundo">Undo</button><button class="btn sm" data-f="skclear">Clear</button></div>
        <input type="text" id="fxsktitle" placeholder="Title for this sketch" value="${esc(o.title||'')}"><canvas id="fxcanvas" class="fxcanvas"></canvas><p class="small muted">Draw with a finger, pen or mouse. Sketch the pathway, table or picture you want to remember, then save it.</p>`,true);
    if(o.kind==='note')return shell('Note',`<input type="text" id="fxntitle" value="${esc(o.title||'')}" placeholder="Title"><textarea id="fxntext" style="min-height:160px" placeholder="Write what you want to remember">${esc(o.text||'')}</textarea>`,true);
    if(o.kind==='ai')return shell(o.t,aiHTML(o.ai,o.data,false)+`<p class="small muted">Written by Claude from the pages shown. Check anything surprising against the book.</p>`,!o.saved);
    return''}
  function keysHTML(d){return`<ul class="fxkeys">${(d.points||[]).map(s=>{const tb=F.tbs.get(s.tb);return`<li>${esc(s.t)} <span class="small muted num">p.${esc(label(tb,s.p))}</span></li>`}).join('')}</ul>
    ${(d.lists||[]).length?`<h3 style="margin-top:6px">Lists to memorise</h3><p class="small muted">First letters, ready for your own mnemonic.</p>${d.lists.map(l=>`<div class="fxlist"><b class="fxinit">${esc(l.items.map(x=>x[0].toUpperCase()).join(''))}</b><span>${l.items.map(x=>`<b>${esc(x[0])}</b>${esc(x.slice(1))}`).join(' \u00b7 ')}</span></div>`).join('')}`:''}`}
  function wrapWords(s,n){const out=[];let cur='';for(const w of String(s).split(/\s+/)){if(cur&&(cur+' '+w).length>n){out.push(cur);cur=w}else cur=cur?cur+' '+w:w}if(cur)out.push(cur);return out.slice(0,4)}
  function mapSVG(d){const n=d.nodes||[];if(!n.length)return'<p class="muted">Not enough text here to draw a map.</p>';const W=720,H=440,cx=W/2,cy=H/2,R=165;
    const pos=n.map((x,i)=>{const a=-Math.PI/2+i*2*Math.PI/n.length;return[cx+Math.cos(a)*R*1.45,cy+Math.sin(a)*R]});
    const box=(x,y,t,c)=>{const ls=wrapWords(t,c?18:16);const w=Math.max(...ls.map(l=>l.length))*7.4+22,h=ls.length*17+14;return`<rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="10" class="${c?'fxc':'fxn'}"/>${ls.map((l,i)=>`<text x="${x}" y="${y-h/2+20+i*17}" text-anchor="middle" class="${c?'fxct':'fxnt'}">${esc(l)}</text>`).join('')}`};
    return`<svg viewBox="0 0 ${W} ${H}" class="fxmap" role="img" aria-label="Concept map around ${esc(d.center)}">${pos.map(([x,y])=>`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" class="fxl"/>`).join('')}
      ${n.map((x,i)=>`<g data-f="mapnode" data-k="${esc(x.w)}" style="cursor:pointer">${box(pos[i][0],pos[i][1],x.w,false)}</g>`).join('')}${box(cx,cy,d.center,true)}</svg>
      <div class="stack" style="gap:6px">${n.filter(x=>x.ex).map(x=>{const tb=F.tbs.get(x.ex.tb);return`<p class="small"><b>${esc(x.w)}</b>: ${esc(x.ex.t)} <span class="muted num">p.${esc(label(tb,x.ex.p))}</span></p>`}).join('')}</div>`}
  function flowSVG(d){const nodes=(d.nodes||[]).slice(0,14),ids=new Set(nodes.map(x=>String(x.id)));const edges=(d.edges||[]).filter(e=>ids.has(String(e.from))&&ids.has(String(e.to))&&e.from!==e.to);
    const lv=new Map(nodes.map(x=>[String(x.id),0]));for(let k=0;k<nodes.length;k++)for(const e of edges){const a=lv.get(String(e.from)),b=lv.get(String(e.to));if(b<=a&&a+1<nodes.length)lv.set(String(e.to),a+1)}
    const rows=[];for(const x of nodes){const l=lv.get(String(x.id));(rows[l]||(rows[l]=[])).push(x)}const R=rows.filter(Boolean);
    const BW=176,GX=24,BH=64,GY=46,W=Math.max(...R.map(r=>r.length))*(BW+GX)+GX,H=R.length*(BH+GY)+GY-10;const P=new Map();
    R.forEach((r,i)=>{const off=(W-r.length*(BW+GX)+GX)/2;r.forEach((x,j)=>P.set(String(x.id),[off+j*(BW+GX)+BW/2,GY/2+i*(BH+GY)+BH/2]))});
    return`<svg viewBox="0 0 ${W} ${H}" class="fxmap" role="img" aria-label="${esc(d.title||'Diagram')}"><defs><marker id="fxar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fxarh"/></marker></defs>
      ${edges.map(e=>{const [x1,y1]=P.get(String(e.from)),[x2,y2]=P.get(String(e.to));const up=y2<=y1;const a=[x1,up?y1-BH/2:y1+BH/2],b=[x2,up?y2+BH/2:y2-BH/2];
        return`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" class="fxl" marker-end="url(#fxar)"/>${e.label?`<text x="${(a[0]+b[0])/2+6}" y="${(a[1]+b[1])/2+4}" class="fxel">${esc(String(e.label).slice(0,24))}</text>`:''}`}).join('')}
      ${nodes.map(x=>{const [cx,cy]=P.get(String(x.id));const ls=wrapWords(x.label,22);return`<rect x="${cx-BW/2}" y="${cy-BH/2}" width="${BW}" height="${BH}" rx="10" class="fxn"/>${ls.map((l,i)=>`<text x="${cx}" y="${cy-(ls.length-1)*8+4+i*16}" text-anchor="middle" class="fxnt">${esc(l)}</text>`).join('')}`}).join('')}</svg>`}
  function aiHTML(kind,d,saved){d=d||{};const pg=p=>p?` <span class="small muted num">p.${esc(p)}</span>`:'';
    if(kind==='sum')return`${d.title?`<b>${esc(d.title)}</b>`:''}<ul class="fxkeys">${(d.points||[]).map(x=>`<li>${esc(x.text)}${pg(x.page)}</li>`).join('')}</ul>${(d.pearls||[]).length?`<div class="notice info small"><b>Pearls</b><ul class="fxkeys">${d.pearls.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}`;
    if(kind==='mnem')return(d.mnemonics||[]).map(m=>`<div class="fxmn"><p class="small muted">${esc(m.for||'')}${pg(m.page)}</p><p class="fxmnem">${esc(m.mnemonic||'')}</p>${(m.parts||[]).length?`<ul class="fxkeys">${m.parts.map(p=>`<li><b>${esc(p.key)}</b> ${esc(p.means)}</li>`).join('')}</ul>`:''}${m.tip?`<p class="small">${esc(m.tip)}</p>`:''}</div>`).join('');
    if(kind==='diag'){const t=d.kind==='table'||(!d.nodes||!d.nodes.length)&&d.rows;return`${d.title?`<b>${esc(d.title)}</b>${pg(d.page)}`:''}${t?`<div class="tbl-wrap"><table class="wraptbl"><thead><tr>${(d.columns||[]).map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${(d.rows||[]).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:flowSVG(d)}`}
    if(kind==='quiz')return`<div class="stack">${(d.questions||[]).map((q,qi)=>`<div class="qcard"><div class="stem" style="font-size:1rem">${qi+1}. ${esc(q.stem)}</div><ol>${(q.options||[]).map((o,i)=>`<li class="fxpq" data-f="pq" data-q="${qi}" data-i="${i}" data-ok="${i===q.answer?1:0}"><b>${LET[i]}.</b><span>${esc(o)}</span></li>`).join('')}</ol><details><summary class="small">Answer</summary><p class="small" style="margin-top:6px"><b>${LET[q.answer]??''}.</b> ${esc(q.explanation||'')}${pg(q.page)}</p></details></div>`).join('')}</div>`;
    if(kind==='expl')return`${d.settled===false?'<div class="notice small">These pages do not fully settle this question.</div>':''}<p>${esc(d.why_correct||'')}${pg(d.page)}</p>${d.key_fact?`<blockquote class="fxquote">${esc(d.key_fact)}</blockquote>`:''}${(d.why_not||[]).length?`<ul class="fxkeys">${d.why_not.map(x=>`<li><b>${esc(x.option)}.</b> ${esc(x.why)}</li>`).join('')}</ul>`:''}`;
    return`<pre class="log">${esc(JSON.stringify(d,null,1))}</pre>`}

  /* ---------- sketch pad ---------- */
  const SK={strokes:[],cur:null};
  function setupCanvas(){const cv=$('#fxcanvas');if(!cv||cv._ok)return;cv._ok=true;const o=FX().out;const W=cv.clientWidth||700,H=Math.round(Math.min(560,Math.max(320,W*.7)));const dpr=Math.min(2,devicePixelRatio||1);
    cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';const g=cv.getContext('2d');g.scale(dpr,dpr);g.lineCap='round';g.lineJoin='round';
    const redraw=()=>{g.fillStyle='#fff';g.fillRect(0,0,W,H);for(const s of SK.strokes){g.strokeStyle=s.c==='erase'?'#fff':s.c;g.lineWidth=s.c==='erase'?s.w*4:s.w;g.beginPath();s.pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));if(s.pts.length===1)g.lineTo(s.pts[0][0]+.1,s.pts[0][1]);g.stroke()}};
    cv._redraw=redraw;redraw();
    const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
    cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);SK.cur={c:o.pen||'#141821',w:+($('#fxsize')?.value||4),pts:[pt(e)]};SK.strokes.push(SK.cur);redraw()});
    cv.addEventListener('pointermove',e=>{if(!SK.cur)return;SK.cur.pts.push(pt(e));redraw()});
    const end=()=>{SK.cur=null};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end)}
  new MutationObserver(()=>{if($('#fxcanvas'))setupCanvas()}).observe(document.getElementById('main'),{childList:true,subtree:true});

  /* ---------- actions ---------- */
  async function tool(k){const X=FX();
    if(k.startsWith('ai:'))return runAI(k.slice(3));
    const list=studySet();
    if(k==='sketch'){SK.strokes=[];X.out={kind:'sketch',title:ctxTitle(),pen:'#141821',src:srcOf(list)};render();scrollOut();return}
    if(k==='note'){X.out={kind:'note',title:ctxTitle(),text:'',src:srcOf(list)};render();scrollOut();return}
    if(!list.length){toast('Search first, or open a page to study.');return}
    if(k==='keys')X.out={kind:'keys',data:{points:keyPoints(list),lists:lists(list)},src:srcOf(list),title:ctxTitle()};
    if(k==='cards')X.out={kind:'cards',data:{cards:cards(list)},i:0,show:false,src:srcOf(list),title:ctxTitle()};
    if(k==='map'){const t=(X.terms||[]).filter(x=>x.on);const center=X.topic||(X.qid?(t[0]?.label||'this question'):X.q)||ctxTitle();X.out={kind:'map',data:conceptMap(list,String(center).slice(0,60)),src:srcOf(list),title:ctxTitle()}}
    render();scrollOut()}
  async function saveOut(){const X=FX(),o=X.out;if(!o)return;
    if(o.kind==='note'){const title=$('#fxntitle').value.trim()||'Note',text=$('#fxntext').value.trim();if(!text){toast('Write something first');return}await saveItem({type:'note',title,topic:X.topic||'',src:o.src,data:{text}});X.out=null;toast('Saved to your notebook');render();return}
    if(o.kind==='sketch'){const cv=$('#fxcanvas');if(!cv||!SK.strokes.length){toast('Draw something first');return}const img=cv.toDataURL('image/jpeg',.72);const title=$('#fxsktitle').value.trim()||ctxTitle();
      const it=await saveItem({type:'sketch',title,topic:X.topic||'',src:o.src,data:{}});F.sk.set(it.id,img);await DB.put('kv','sk.'+it.id,img);skUp(it.id,img);SK.strokes=[];X.out=null;toast('Sketch saved to your notebook');render();return}
    const data=o.kind==='ai'?{ai:o.ai,r:o.data}:o.data;
    await saveItem({type:o.kind,title:o.kind==='ai'?`${o.t}: ${o.title}`:o.title,topic:X.topic||'',src:o.src,data});o.saved=true;toast('Saved to your notebook');render()}
  function selNote(){const s=String(getSelection&&getSelection()||'').trim();if(!s){toast('Select some text on the page first, then press this again.',4000);return}const X=FX();X.out={kind:'note',title:ctxTitle(),text:s,src:[{tb:X.read.tb,p:X.read.p}]};render();scrollOut()}
  function readPage(tb,p,pi){const X=FX();X.read={tb,p:Math.max(1,p),pi:pi!=null?+pi:null};X.out=null;render();
    setTimeout(()=>{let el=null;if(X.read.pi!=null&&F.idx){const P=F.idx.P[X.read.pi];if(P){const first=P.t.split(/\n{2,}/).find(x=>!x.startsWith('# '));if(first){for(const n of $$('.fxtext p'))if(n.textContent.startsWith(first.slice(0,40))){el=n;break}}}}
      if(el){el.classList.add('fxhere');el.scrollIntoView({block:'center'})}else{const r=$('.fxreader');if(r)r.scrollIntoView({block:'start'})}},30)}

  document.addEventListener('click',async e=>{
    const el=e.target.closest('[data-f]');if(!el||S.view!=='focus'&&el.dataset.f!=='open'&&el.dataset.f!=='saveq')return;const d=el.dataset,X=FX();
    if(el.tagName==='INPUT'&&(el.type==='checkbox'||el.type==='radio')){
      if(d.f==='pick'||d.f==='pickpg'){const had=X.set.length;const ks=String(d.k).split(',').map(Number);X.set=el.checked?[...new Set([...X.set,...ks])]:X.set.filter(x=>!ks.includes(x));el.closest('.fxres')?.classList.toggle('on',el.checked);const lab=$('.fxtools .spread .small');if(lab)lab.textContent='Working on '+setLabel();if(!had!==!X.set.length)softFocus()}

    }
  });
  document.addEventListener('click',e=>{const el=e.target.closest('[data-f]');if(el&&el.closest('#modal')&&el.dataset.f==='delbookgo'){e.preventDefault();delBook(el.dataset.id)}},true);
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='fxq'){e.preventDefault();const v=e.target.value.trim();if(v){setQuery(v);render()}}});

    if(t.id==='fx-file'&&t.files[0]){const f=t.files[0];if(!/\.(pdf|txt)$/i.test(f.name)){toast('Choose a PDF or .txt file');t.value='';return}X.add={file:f,name:$('#fx-name').value.trim()||cleanBookName(f.name),keep:$('#fx-keep').checked&&f.size<600e6};render()}
