<style>
/* Layout: sticky top bar + tab strip over one centred working column (max 960px); quiz takes the column alone */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#EEF0F4; --line:#DDE1E8; --ink:#141821; --muted:#5B6475;
  --accent:#F2B33D; --accent-ink:#1A1406; --accent-soft:#FCEFD3; --accent-text:#8F5400; --info:#2F5FD0;
  --ok:#1F7A4D; --ok-soft:#E3F4EA; --bad:#C2392B; --bad-soft:#FCE8E5; --warn:#9A6200; --warn-soft:#FBF0D9;
  --shadow:0 1px 2px rgb(20 24 33 / .06);
  --f-display:"Manrope", ui-sans-serif, system-ui, sans-serif;
  --f-body:"Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:16px;
}
/* Night is the default when the phone or computer is in dark mode ("Auto"), or when chosen */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1116; --surface:#171B22; --surface-2:#1F242D; --line:#2A303B; --ink:#E9ECF2; --muted:#A9B0BD;
  --accent:#F2B33D; --accent-ink:#1A1406; --accent-soft:#3A2D10; --accent-text:#F2B33D; --info:#7AA7FF;
  --ok:#4CC38A; --ok-soft:#12271D; --bad:#FF7A6B; --bad-soft:#2A1715; --warn:#E8A33A; --warn-soft:#2E2410;
  --shadow:0 1px 0 rgb(255 255 255 / .02); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#171B22; --surface-2:#1F242D; --line:#2A303B; --ink:#E9ECF2; --muted:#A9B0BD;
  --accent:#F2B33D; --accent-ink:#1A1406; --accent-soft:#3A2D10; --accent-text:#F2B33D; --info:#7AA7FF;
  --ok:#4CC38A; --ok-soft:#12271D; --bad:#FF7A6B; --bad-soft:#2A1715; --warn:#E8A33A; --warn-soft:#2E2410;
  --shadow:0 1px 0 rgb(255 255 255 / .02); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.75rem;letter-spacing:-.01em} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.lbl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;display:flex;flex-direction:column;gap:8px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em;white-space:nowrap}
.mark{width:28px;height:28px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.8rem;font-family:var(--f-mono);font-weight:600}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:0;cursor:pointer;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok .dot{background:var(--ok)} .sync.busy .dot{background:var(--warn)} .sync.err .dot{background:var(--bad)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px 10px;cursor:pointer;color:var(--muted);font-weight:700;font-size:.92rem;border-bottom:2.5px solid transparent;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.themebtn{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;min-height:34px;padding:4px 12px;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.8rem;cursor:pointer}
.brandrow .right{display:flex;gap:8px;align-items:center;min-width:0}
.tab .pill{margin-left:6px}

main{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 64px;display:flex;flex-direction:column;gap:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.flat{background:none;border-style:dashed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:12px;cursor:pointer;font-weight:700;font-size:.93rem;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 12px;min-height:36px;font-size:.84rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-family:var(--f-body)}
.ts{display:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.acc{background:var(--accent-soft);color:var(--accent-text)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.8rem;font-weight:700;color:var(--muted)}
input[type=text],input[type=password],input[type=email],input[type=number],input[type=search],select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical;line-height:1.45}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface-2)}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:10px 14px;cursor:pointer;font-size:.88rem;font-weight:700;color:var(--muted);border-right:1px solid var(--line)}
.seg label:last-child span{border-right:0}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--info);outline-offset:-2px}
.chk{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:.92rem}
.chk input{margin-top:4px;accent-color:var(--accent)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.tile .v{font-family:var(--f-mono);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .s{font-size:.8rem;color:var(--muted)}
.tile.ok .v{color:var(--ok)} .tile.bad .v{color:var(--bad)}
/* daily target: progress ring, day chips, history */
.goal{background:linear-gradient(135deg,var(--surface) 35%,var(--accent-soft));border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow);margin-bottom:12px}
.goal.done{background:linear-gradient(135deg,var(--surface) 35%,var(--ok-soft))}
.goal.late{background:linear-gradient(135deg,var(--surface) 35%,var(--warn-soft))}
.gring{position:relative;width:132px;height:132px;flex:none}
.gring svg{display:block}
.gring .garc{transition:stroke-dasharray .6s ease}
.gring .gin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.gring .gn{font-family:var(--f-display);font-weight:800;font-size:2.1rem}
.gring .gof{font-size:.8rem;color:var(--muted);font-weight:700}
.gcheck{animation:gpop .45s ease-out}
.gcheck path{stroke-dasharray:40;stroke-dashoffset:0;animation:gdraw .6s .15s ease-out backwards}
@keyframes gpop{from{transform:scale(.5);opacity:0}}
@keyframes gdraw{from{stroke-dashoffset:40}}
.gbody{flex:1;min-width:200px;display:flex;flex-direction:column;gap:10px}
.gweek{display:flex;gap:6px;flex-wrap:wrap}
.gday{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem;color:var(--muted);min-width:34px;font-weight:700}
.gdot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface)}
.gday.done .gdot{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.gday.late .gdot{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.gday.missed .gdot{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.gcnt{font-size:.62rem;font-weight:800;font-variant-numeric:tabular-nums}
.gday.open .gdot,.gday.behind .gdot{border-color:var(--accent);border-style:dashed;color:var(--accent-text)}
.gday.pre .gdot{opacity:.35;border-style:dotted}
.gday.today{color:var(--ink)}
.ghist{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px 4px;margin-top:10px}
.ghist .gday{min-width:0}
.glegend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);align-items:center}
.glegend .gday{flex-direction:row;font-size:.8rem;gap:6px}
.glegend .gdot{width:20px;height:20px}
.goal input[type=time],.panel input[type=time]{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px;width:100%;min-width:0}
@media (max-width:560px){.goal{justify-content:center}.gring{margin:0 auto}}
.goal details summary{cursor:pointer;font-weight:700;font-size:.88rem;color:var(--accent-text)}
@media (prefers-reduced-motion:reduce){.gcheck,.gcheck path{animation:none}}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
table.wraptbl td{white-space:normal;vertical-align:top}
table.wraptbl td:first-child{white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
tr.sub td:first-child{padding-left:30px;color:var(--muted)}
td.wrap{white-space:normal;min-width:220px}
td.bkname{white-space:normal;overflow-wrap:anywhere;min-width:180px;max-width:420px}
.bkcell{display:flex;align-items:center;gap:12px}.bthumb{flex:none;width:38px;height:52px;border-radius:5px;object-fit:cover;background:#fff;border:1px solid var(--line);box-shadow:0 1px 3px rgb(0 0 0 / .15)}
.bthumb.ph{display:grid;place-items:center;font:700 .8rem/1 var(--f-mono,monospace);color:#fff;letter-spacing:.02em;border:0}.bthumb.big{width:84px;height:116px;border-radius:8px;font-size:1.3rem}
.bkhead{display:flex;gap:16px;align-items:flex-start}.bkhead .cvbox{display:flex;flex-direction:column;gap:6px;align-items:center}
.tree summary .chk{overflow-wrap:anywhere;flex-wrap:wrap;max-width:100%}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ok)}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:18px;max-width:780px;width:100%;margin:0 auto}
.qbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prog{flex:1;min-width:140px;display:flex;flex-direction:column;gap:5px}
.track{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);transition:width .25s}
.clock{font-family:var(--f-mono);font-weight:600;font-size:1.05rem;padding:8px 12px;border-radius:12px;background:var(--surface-2);color:var(--accent-text);font-variant-numeric:tabular-nums}
.clock.low{background:var(--bad-soft);color:var(--bad)}
.clock[data-l]::before{content:attr(data-l);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:6px;font-weight:600}
.exres{display:inline-block;padding:4px 14px;border-radius:999px;font-weight:700;letter-spacing:.04em}.exres.ok{background:var(--ok-soft,#e3f4ea);color:var(--ok)}.exres.bad{background:var(--bad-soft);color:var(--bad)}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.84rem;color:var(--muted)}
.seen{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:999px;border:1.5px solid var(--accent);color:var(--accent-text);background:var(--surface);font:700 .74rem/1 var(--f-mono);font-variant-numeric:tabular-nums;flex:none;cursor:help}
.qprev{margin-right:auto}
.reviewing{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);font-weight:700;font-size:.88rem}
.backbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.backbtn[hidden]{display:none}
.backbtn.lbl{width:auto;padding:0 10px 0 6px;gap:2px;display:inline-flex;align-items:center;font:inherit;font-size:13px;font-weight:700;max-width:130px;text-transform:none;letter-spacing:0}
.backbtn .backlbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.brand:has(.backbtn:not([hidden])) .brandname{display:none}}
.hcard.resumetop{margin-bottom:12px;border-color:var(--info)}
.undo-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.figs{display:flex;flex-direction:column;gap:8px;margin:12px 0 4px}.figs img{max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px;cursor:zoom-in}
.figover{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.82);overflow:auto;padding:56px 12px 24px;-webkit-overflow-scrolling:touch}.figover img{display:block;margin:0 auto;background:#fff;max-width:none;width:max(100%,900px);border-radius:6px}.figover .btn{position:fixed;top:12px;right:12px}
@media (min-width:960px){.figover img{width:auto;max-width:100%}}
.stem{font-size:1.18rem;line-height:1.55;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;min-height:54px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;line-height:1.45;width:100%}
.opt b{font-family:var(--f-mono);flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);font-size:.85rem}
.opt span{overflow-wrap:anywhere;padding-top:1px;flex:1}
.opt em{font-style:normal;font-size:.75rem;font-weight:800;flex:none}
.opt.right em{color:var(--ok)} .opt.wrong em{color:var(--bad)}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)} .opt.sel b{background:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right b{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong b{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.verdict{display:flex;gap:10px;align-items:center;font-weight:700;font-family:var(--f-display);font-size:1.15rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.expl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.qactions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}

.qcard{border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.qcard .stem{font-size:1rem}
.case{border:1px solid var(--line);border-left:4px solid var(--info);background:var(--surface-2);border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:.98rem;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.case>b{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}.qcard .case{font-size:.9rem;max-height:14em;overflow:auto}
.cont{font-size:.8rem;color:var(--muted);margin:0 0 6px}
.qcard ol{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.qcard li{display:flex;gap:8px;overflow-wrap:anywhere}
.qcard li b{font-family:var(--f-mono);flex:none}
.qcard li.right{color:var(--ok);font-weight:700}
.qcard li.mine{color:var(--bad)}
details>summary{cursor:pointer;font-weight:700;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+ ";font-family:var(--f-mono);color:var(--muted)}
details[open]>summary::before{content:"– "}
.tree{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tree .topics{display:flex;flex-direction:column;gap:3px;padding:6px 0 4px 26px}

.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.empty{padding:30px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.empty h3{color:var(--ink)}

/* ================= IndexedDB (local copy of everything) ================= */
const IDB={db:null,ok:false,
  open(){return new Promise(res=>{try{const r=indexedDB.open('mcq-vault'+accDb(),1);
    r.onupgradeneeded=()=>{const d=r.result;for(const s of['kv','chunks','logs','jobs'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s)};
    r.onsuccess=()=>{this.db=r.result;this.ok=true;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false);}catch(e){res(false)}})},
  req(store,mode,fn){if(!this.ok)return Promise.resolve(undefined);return new Promise((res,rej)=>{try{const t=this.db.transaction(store,mode);const q=fn(t.objectStore(store));t.oncomplete=()=>res(q&&'result'in q?q.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}catch(e){rej(e)}})},
  get(s,k){return this.req(s,'readonly',o=>o.get(k)).catch(()=>undefined)},
  put(s,k,v){return this.req(s,'readwrite',o=>o.put(v,k))},
  del(s,k){return this.req(s,'readwrite',o=>o.delete(k)).catch(()=>{})},
  clear(s){return this.req(s,'readwrite',o=>o.clear()).catch(()=>{})},
  // read and write one record in a single transaction, so two open tabs cannot overwrite each other
  merge(s,k,fn){if(!this.ok)return Promise.resolve(undefined);return new Promise((res,rej)=>{try{const t=this.db.transaction(s,'readwrite');const o=t.objectStore(s);let out;const g=o.get(k);
    g.onsuccess=()=>{out=fn(g.result);if(out!==undefined)o.put(out,k)};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}catch(e){rej(e)}})},
  async all(s){if(!this.ok)return[];try{const[keys,vals]=await Promise.all([this.req(s,'readonly',o=>o.getAllKeys()),this.req(s,'readonly',o=>o.getAll())]);return keys.map((k,i)=>[k,vals[i]])}catch(e){return[]}}
};

function helpLink(it){const v=it.v.trim(),l=(it.l||'').toLowerCase(),dg=v.replace(/[^\d]/g,''),T='https:\x2f\x2f';
  const isTg=/telegram|تلغرام|تيليجرام|تلكرام|تليجرام/i.test(l),isIg=/instagram|انستغرام|انستا|إنستغرام/i.test(l),isFb=/facebook|فيسبوك|فيس بوك/i.test(l),isWa=/whats|واتس/i.test(l);
  if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))return{href:'mailto:'+v,ic:'em'};
  const u=v.replace(/^https?:\x2f\x2f/i,'').replace(/^www\./i,'');
  if(/^(t\.me|telegram\.me)\x2f/i.test(u))return{href:T+u,ic:'tg',blank:1};
  if(/^(wa\.me|api\.whatsapp\.com)/i.test(u))return{href:T+u,ic:'wa',blank:1};
  if(/^instagram\.com\x2f/i.test(u))return{href:T+u,ic:'ig',blank:1};
  if(/^(facebook\.com|fb\.com|m\.facebook\.com)\x2f/i.test(u))return{href:T+u,ic:'fb',blank:1};
  if(/^https:\x2f\x2f\S+$/i.test(v))return{href:v,ic:'web',blank:1};
  const hd=v.replace(/^@/,'');
  if(/^@?[A-Za-z0-9_.]{3,40}$/.test(v)&&(v[0]==='@'||isTg||isIg||isFb)&&!/^\d+$/.test(hd)){if(isIg)return{href:T+'instagram.com/'+hd,ic:'ig',blank:1};if(isFb)return{href:T+'facebook.com/'+hd,ic:'fb',blank:1};return{href:T+'t.me/'+hd,ic:'tg',blank:1}}
  if(/^[\d\s+()\-]{7,24}$/.test(v)&&dg.length>=7){if(isWa)return{href:T+'wa.me/'+dg,ic:'wa',blank:1,extra:`<a class="btn sm" href="tel:${v.replace(/[^\d+]/g,'')}">${HELP_IC.ph.replace(/width="28" height="28"/,'width="16" height="16"')} Call</a>`};if(isTg)return{href:T+'t.me/+'+dg,ic:'tg',blank:1};return{href:'tel:'+v.replace(/[^\d+]/g,''),ic:'ph',extra:`<a class="btn sm" href="${T}wa.me/${dg}" target="_blank" rel="noopener">${HELP_IC.wa.replace(/width="28" height="28"/,'width="16" height="16"')} WhatsApp</a>`}}
  return null}

function bookPickUI(){const bs=libBooks().filter(b=>(M.bookQ.get(b.id)||[]).length).sort((a,b)=>a.name.localeCompare(b.name));
  if(!bs.length)return`<div class="field" data-show="book"><div class="notice info">Your library is empty.</div></div>`;
  const cur=bs.some(b=>b.id===S.bbBook)?S.bbBook:bs[0].id;S.bbBook=cur;
  return`<label class="field" data-show="book"><span>Book</span><select id="bb-book">${bs.map(b=>`<option value="${b.id}" ${b.id===cur?'selected':''} data-notr>${esc(b.name)} (${nf((M.bookQ.get(b.id)||[]).length)})</option>`).join('')}</select></label>
    <div class="field" data-show="book"><span>Chapters</span><div class="tlist" id="bb-chs">${bookChs(cur,'bb',null)}</div>
    <p class="muted small">Tick Whole book, or one or more chapters. The number is how many questions of the chapter you have not answered yet.</p></div>`}
function bookUn(bid,i,skip){let un=0,all=0;for(const id of M.bookQ.get(bid)||[]){const q=M.Q.get(id);if(!q||(i!=null&&q.t!==i))continue;all++;if(!(M.qs.get(id)?.n)&&!(skip&&skip.has(id)))un++}return{un,all}}
function bookChs(bid,pre,sel){const b=M.books.get(bid);if(!b)return'';const tot=bookUn(bid,null);
  const cnt=x=>x.un?`<span class="muted small"><span>${nf(x.un)}</span> <span>not answered</span></span>`:`<span class="small" style="color:var(--ok)">Finished</span>`;
  const whole=!sel||!sel.length;
  return`<label class="chk"><input type="checkbox" name="${pre}w" value="1" ${whole?'checked':''}> <b style="flex:1">Whole book</b> ${cnt(tot)}</label>`+
    (b.topics||[]).map((c,i)=>{const x=bookUn(bid,i);if(!x.all)return'';return`<label class="chk"><input type="checkbox" name="${pre}ch" value="${i}" ${!whole&&sel.includes(i)?'checked':''}> <span style="flex:1" data-notr>${esc(c||'Chapter '+(i+1))}</span> ${cnt(x)}</label>`}).join('')}
function bookTick(t,pre){const box=t.closest('.tlist');if(!box)return;
  if(t.name===pre+'w'&&t.checked)$$(`input[name=${pre}ch]`,box).forEach(c=>c.checked=false);
  if(t.name===pre+'ch'){const any=$$(`input[name=${pre}ch]:checked`,box).length;const w=$(`input[name=${pre}w]`,box);if(w)w.checked=!any}}
function bookScope(bid,chs){return chs&&chs.length?{books:[],topics:chs.map(i=>bid+'|'+i)}:{books:[bid],topics:[]}}
function bookCfg(f){const bid=$('#bb-book',f)?.value||'',chs=$$('input[name=bbch]:checked',f).map(i=>+i.value);
  return{style:'book',book:bid,chs,...bookScope(bid,chs),source:'all',count:Math.max(1,parseInt($('#cfg-count').value)||40),order:'random',
    timing:$('input[name=tim]:checked',f).value,sec:Math.max(5,parseInt($('#cfg-sec').value)||60),min:Math.max(1,parseInt($('#cfg-min').value)||45),feedback:$('input[name=fb]:checked',f).value,qtype:readQt(f)}}
// this choice's round: the fewest times any of its questions has come up; "finished" = every question has come up the same number of times, at least once
function bookRound(ids,skip){const n=roundOf();let lo=Infinity,hi=0;for(const id of ids){const k=n(id);if(k<lo)lo=k;if(k>hi)hi=k}if(lo===Infinity)lo=0;
  return{lo,hi,done:lo>=1&&lo===hi,fresh:ids.filter(id=>n(id)<=lo&&!(skip&&skip.has(id)))}}
function bookNote(ids,count){if(!ids.length)return'';const r=bookRound(ids);
  if(r.done)return' · you have finished this choice: Start lets you pick new chapters or repeat it';
  return r.fresh.length<count?` · <span>${nf(r.fresh.length)}</span> <span>left, then you pick new chapters or repeat these</span>`:''}
async function bookStart(c,again){const ids=buildPool(c);if(!ids.length)return toast('No questions match those choices');
  const r=bookRound(ids);if(r.done&&!again)return bookDone(null,c);
  c={...c};delete c.want;delete c.scopeText;if(r.fresh.length<c.count)c.want=c.count;
  return startSession(c,r.fresh)}
function bookDone(A,c){const cf=A?A.cfg:c,bid=cf.book,b=M.books.get(bid);if(!b){if(A){A.cfg.want=0;return saveActive(A).then(()=>finishSession('complete'))}return}
  const done=A?Object.keys(A.ans).length:0;
  modal(`<h3>${A?'You have finished your choice':'You have already finished this choice'}</h3>
    <p class="small" style="max-width:62ch"><span data-notr>${esc(sessionScope0({...cf,scopeText:''}))}</span></p>
    <p class="small" style="max-width:62ch">${A?`Every question of it has come up. <span>You answered</span> <span>${nf(done)}</span> <span>in this session.</span> `:'Every question of it has come up. '}Pick new chapters to go on with, or repeat the same ones. Questions you have not answered come first.</p>
    <div class="tlist" style="max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:8px 0">${bookChs(bid,'bn',[-1])}</div>
    <div class="row" style="justify-content:flex-end;flex-wrap:wrap;gap:8px">
      <button class="btn" data-ad="bookGo" data-k="end">${A?'End the session here':'Cancel'}</button>
      <button class="btn" data-ad="bookGo" data-k="same">Repeat the same chapters</button>
      <button class="btn pri" data-ad="bookGo" data-k="new">Go on with the ticked chapters</button></div>`);
  const w=$('#modal input[name=bnw]');if(w)w.checked=false;
  S.bookAsk={A:!!A,c:A?null:c}}
async function bookGo(k){const R=S.bookAsk;if(!R)return;const whole=!!$('#modal input[name=bnw]:checked'),chs=$$('#modal input[name=bnch]:checked').map(i=>+i.value);
  if(k==='new'&&!whole&&!chs.length)return toast('Tick Whole book or one or more chapters first.');
  closeModal();S.bookAsk=null;
  if(!R.A){if(k==='end')return;const c=R.c;if(k==='same')return bookStart(c,true);
    return bookStart({...c,chs:whole?[]:chs,...bookScope(c.book,whole?[]:chs)},false)}
  let A=S.active;if(!A)return;const len=A.qids.length;
  await syncActive();while(S.activeBusy)await new Promise(r=>setTimeout(r,50));if(S.active!==A)return;
  if(A.qids.length>len||!(A.cfg.want>A.qids.length)&&A.idx+1<A.qids.length){toast('The questions to continue with were already chosen on another device',5000);
    if(A.ans[A.qids[A.idx]]&&A.idx+1<A.qids.length)await nextQ();else render();return}
  if(k==='end'){A.cfg.want=0;await saveActive(A);return finishSession('complete')}
  const have=new Set(A.qids),need=A.cfg.want-A.qids.length,old=sessionScope(A.cfg);
  let cf=A.cfg;if(k==='new')cf={...A.cfg,chs:whole?[]:chs,...bookScope(A.cfg.book,whole?[]:chs)};
  const pool=buildPool({...cf,source:'all'});
  const add=(k==='same'?coverOrder(pool.filter(id=>!have.has(id))):shuffle(bookRound(pool,have).fresh)).slice(0,need);
  if(!add.length){ // every question of it is in this session already: end it and start again on the same choice
    const c={...cf};A.cfg.want=0;await saveActive(A);await finishSession('complete');return bookStart(c,true)}
  if(k==='new'){A.cfg.books=cf.books;A.cfg.topics=cf.topics;A.cfg.chs=cf.chs;A.cfg.scopeText=old+' + '+sessionScope0({...cf,scopeText:''})}
  A.qids=[...A.qids,...add];if(A.qids.length>=A.cfg.want)A.cfg.want=0;A.cfg.more=(A.cfg.more||0)+1;A.cfg.moreAt=now();
  await saveActive(A);await saveSessionMeta();await nextQ()}
document.addEventListener('change',e=>{const t=e.target;if(!t)return;
  if(t.id==='bb-book'){S.bbBook=t.value;const box=$('#bb-chs');if(box)box.innerHTML=bookChs(t.value,'bb',null);return}

// every screen is a history entry, so the Back button in the header and the phone / browser back gesture both step back.
// Open windows (edit question, enlarged figure) get an entry too, so back closes them first.
const NAV={stack:[],i:0,ign:0,ignT:null,wait:null,api:null,closing:false};
function navApi(){
  if(NAV.api)return NAV.api;
  const g=window.google&&google.script&&google.script.history;
  NAV.api=g?{push:(st,h)=>g.push(st,{},h),replace:(st,h)=>g.replace(st,{},h),listen:f=>g.setChangeHandler(e=>f(e&&e.state))}
    :{push:(st,h)=>{try{history.pushState(st,'','#'+h)}catch(e){}},replace:(st,h)=>{try{history.replaceState(st,'','#'+h)}catch(e){}},listen:f=>addEventListener('popstate',e=>f(e.state))};
  return NAV.api}
function navSnap(){const v=S.view,s={v};
  if(v==='library'&&S.libBook)s.lib=S.libBook;
  if(v==='stats'){s.st=S.statsTab;if(S.sessDetail)s.sd=S.sessDetail}
  if(v==='focus'&&S.fx){s.ft=S.fx.tab;if(S.fx.read)s.fr={...S.fx.read}}
  return s}
// turning pages in the textbook reader is not a new screen
function navKey(s){return JSON.stringify([s.v,s.lib||'',s.st||'',s.sd||'',s.ft||'',s.fr?s.fr.tb:''])}
function navState(){const s={...NAV.stack[NAV.i]};delete s.y;return{mv:1,n:NAV.i,s}}
function navInit(){NAV.stack=[{v:'study'}];NAV.i=0;try{navApi().replace(navState(),'study');navApi().listen(navOnChange)}catch(e){console.warn('history',e)}navBtn()}
function navIgnore(){NAV.ign++;clearTimeout(NAV.ignT);NAV.ignT=setTimeout(()=>{NAV.ign=0;navFlushPend()},1500)}
// while the browser is still stepping back, new history entries wait, then go in, in order
function navFlushPend(){if(!NAV.pend)return;NAV.pend=false;clearTimeout(NAV.pendT);const q=NAV.after||[];NAV.after=[];
  for(const n of q)if(n<NAV.stack.length){const s={...NAV.stack[n]};delete s.y;try{navApi().push({mv:1,n,s},s.v)}catch(e){}}}
const NAVLBL={quiz:'Session',summary:'Results',bank:'Bank',stats:'Stats'};
function navLbl(){if(overlayOpen())return'Close';const p=NAV.stack[NAV.i-1];if(!p)return'';const t=TABS.find(x=>x[0]===p.v);return NAVLBL[p.v]||(t?t[1]:'Back')}
function navBtn(){const b=$('#backbtn');if(!b)return;b.hidden=NAV.i<=0&&!overlayOpen();if(b.hidden)return;const l=navLbl();let sp=b.querySelector('.backlbl');if(!sp){sp=document.createElement('span');sp.className='backlbl';b.appendChild(sp)}if(sp.dataset.k!==l){sp.dataset.k=l;sp.textContent=l}b.classList.add('lbl');b.title=l==='Close'?'Close':'Back to '+l;b.setAttribute('aria-label',b.title)}
function navCommit(y0){
  if(NAV.restoring||!NAV.stack.length)return;

  if(navKey(cur)===k){if(cur.fr||s.fr)cur.fr=s.fr;return}
  // a session that just ended: its summary takes the session's place, so back does not reopen a finished session
  if(cur.v==='quiz'&&s.v==='summary'){NAV.stack[NAV.i]=s;try{navApi().replace(navState(),s.v)}catch(e){}navBtn();return}
  // returned to the screen just before (a Close or "Back to the question" button): step the history back too
  if(NAV.i>0&&!cur.ov&&!NAV.pend&&navKey(NAV.stack[NAV.i-1])===k){NAV.i--;NAV.stack.length=NAV.i+1;navIgnore();NAV.pend=true;NAV.after=[];clearTimeout(NAV.pendT);NAV.pendT=setTimeout(navFlushPend,1000);try{history.back()}catch(e){}navBtn();return}
  cur.y=y0||0;NAV.stack.length=NAV.i+1;NAV.stack.push(s);NAV.i++;

function navOnChange(st){

function navApply(s){

function navBack(){

  NAV.wait=setTimeout(()=>{NAV.wait=null;if(closeOverlays()){navBtn();return}NAV.i=want;NAV.stack.length=want+1;navApply(NAV.stack[want]);try{navApi().replace(navState(),NAV.stack[want].v)}catch(e){}},700);

function navOverlayClosed(){setTimeout(()=>{const c=NAV.stack[NAV.i];if(c&&c.ov&&!overlayOpen()){NAV.i--;NAV.stack.length=NAV.i+1;navIgnore();try{history.back()}catch(e){}}navBtn()},0)}

function computeStats(days){
  const from=days?now()-days*DAY:0;const T={n:0,c:0,w:0,ms:0,timed:0,timedMs:0,to:0},byB=new Map(),byT=new Map(),byDay=new Map(),uniq=new Set();let orph=0;
  for(const r of M.att){if(r.ts<from)continue;const q=M.Q.get(r.q);if(!q){orph++;continue}
    const add=(m,k)=>{let o=m.get(k);if(!o){o={n:0,c:0,w:0,ms:0,u:new Set()};m.set(k,o)}o.n++;r.ok?o.c++:o.w++;o.ms+=r.ms;o.u.add(r.q)};
    T.n++;r.ok?T.c++:T.w++;T.ms+=r.ms;if(r.to&&!r.ok)T.to++;uniq.add(r.q);add(byB,q.b);add(byT,q.b+'|'+q.t);add(byDay,dayKey(r.ts));}
  return{T,byB,byT,byDay,uniq,orph};
}

function daysSinceFirst(){return M.att.length?Math.ceil((now()-M.att[0].ts)/DAY)+1:30}
function dailyChart(byDay,days){
  days=Math.min(days,365);const keys=[];for(let i=days-1;i>=0;i--)keys.push(dayKey(now()-i*DAY));
  const vals=keys.map(k=>byDay.get(k)||{n:0,c:0,w:0});const step=Math.max(1,Math.ceil(Math.max(4,...vals.map(v=>v.n))/4)),max=step*4;
  const W=640,H=200,L=38,R=34,Tp=12,B=28,cw=(W-L-R)/keys.length,bw=Math.max(1,cw*0.72);
  const y=v=>Tp+(H-Tp-B)*(1-v/max),yp=p=>Tp+(H-Tp-B)*(1-p/100);
  const ticks=[0,step,step*2,step*3,max];
  let g=ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">${v}</text>`).join('');
  g+=[0,50,100].map(p=>`<text x="${W-R+6}" y="${yp(p)+4}" font-size="10" fill="var(--accent)" font-family="var(--f-mono)">${p}%</text>`).join('');
  let bars='',pts=[];
  vals.forEach((v,i)=>{const x=L+i*cw+(cw-bw)/2;if(v.n){bars+=`<rect x="${x}" y="${y(v.c)}" width="${bw}" height="${y(0)-y(v.c)}" fill="var(--ok)"><title>${dayLabel(keys[i])}: ${v.c} correct, ${v.w} wrong</title></rect><rect x="${x}" y="${y(v.n)}" width="${bw}" height="${y(v.c)-y(v.n)}" fill="var(--bad)"><title>${dayLabel(keys[i])}: ${v.c} correct, ${v.w} wrong</title></rect>`;pts.push([x+bw/2,yp(v.c*100/v.n)])}});
  const line=pts.length>1?`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round"/>`:'';
  const dots=pts.length?`<circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3" fill="var(--accent)"/>`:'';
  const lab=[0,Math.floor(keys.length/2),keys.length-1].map(i=>`<text x="${L+i*cw+cw/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">${dayLabel(keys[i])}</text>`).join('');
  return`<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Answers per day">${g}${bars}${line}${dots}${lab}</svg></div>`;
}

/* ================= extraction parser (pure) ================= */
/*PARSER-START*/
/* Adaptive MCQ reader.
   1. clean lines (page numbers, running headers/footers, section markers)
   2. find numbered items and link them into sequences (1,2,3...); short numbered lists nested
      inside another sequence's item are absorbed as text
   3. classify each sequence: questions (MCQ / true-false statements) or answers (key / verdict+explanation)
   4. pair answer sequences with question sequences (topic name, numbering, echoed question text, option text)
   5. cross-check every pairing and flag what does not fit */
const Parser=(()=>{
  const LT='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const words=s=>(s||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(Boolean);
  // the same words give or take a spelling slip: "Transexualism"/"Transsexualism", "egosyntonic"/"ego-syntonic"
  // "13%" in the key for the option "10%–14%", "12–24 months" for the option "15": the number falls in the printed range
  const numFit=(opt,key)=>{const rg=t=>{if(/[a-z]{3,}/i.test(String(t).replace(/\b(?:months?|years?|weeks?|days?|hours?|mg|kg|ml|per\s*cent|percent)\b/gi,'')))return null;const n=(String(t).match(/\d+(?:\.\d+)?/g)||[]).map(Number);return n.length===1?[n[0],n[0]]:n.length===2&&n[0]<=n[1]?n:null};
    const a=rg(opt),b=rg(key);return !!(a&&b&&a[0]<=b[1]&&b[0]<=a[1])};
  const spellSame=(x,y)=>{const a=words(x).join(''),b=words(y).join('');if(!a||!b||Math.abs(a.length-b.length)>2||Math.min(a.length,b.length)<5)return false;

async function impRead(){

  if(!f){toast('Choose the book file first');return}if(!I.bookId&&!I.name){toast('Give the new book a name');return}
  if(from&&to&&to<from){toast('"To page" must be after "From page"');return}

    else if(/\.docx$/i.test(f.name))r=sliceRange(await extractDocx(f),from,to);else r=sliceRange(textToPages(await f.text()),from,to);
    if(!r.pages.length)throw new Error('that page range is outside the file');

    I.kind=r.kind||summarizeKind({},/\.docx$/i.test(f.name)?'docx':'txt');I.cover=r.cover||null;
  }catch(e){console.error(e);I.step='pick';render();toast('Could not read the file: '+(e.message||e));if(I.batch){(S.impBatch=S.impBatch||[]).push({n:I.name,skip:'skipped: the file could not be read'});return impNext(I)}return}
  S.lastFile={file:f,bookId:I.bookId};
  if(I.kind?.k==='scan'){I.step='pick';render();toast('This PDF has no text to read. Run it through OCR first, then import the OCR version.',8000);if(I.batch){(S.impBatch=S.impBatch||[]).push({n:I.name,skip:'skipped: no text to read (needs OCR)'});return impNext(I)}return}
  if(I.method==='ai'){await aiExtract()}else{I.step='parsing';I.msg='Finding questions…';render();await sleep(30);
    try{I.result=Reader.parse(I.pages,{heading:I.heading||undefined,defaultTopic:I.defaultTopic})}catch(e){console.error(e);toast('Extraction failed: '+e.message);I.step='pick';render();return}
    if(I.result.questions.some(q=>q.fig)&&/\.pdf$/i.test(f.name)){I.msg='Copying figures and tables…';render();

    I.excluded=new Set();I.step='review';I.revPage=0;render();

/* ---- Claude-assisted extraction ---- */
const normT=s=>(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
function aiChunks(pages){const max=Cloud.mode==='gas'?4500:9000;const out=[];let cur=[],len=0;for(const pg of pages){const t=pg.lines.join('\n');if(len+t.length>max&&cur.length){out.push(cur);cur=[];len=0}cur.push(pg);len+=t.length}if(cur.length)out.push(cur);return out}
async function aiExtract(){
  const I=S.imp;const chunks=aiChunks(I.pages);
  I.ai=I.ai&&I.ai.n===chunks.length?I.ai:{n:chunks.length,i:0,results:[],failed:[],lastTopic:'',paused:false};
  I.step='parsing';I.progMax=chunks.length;
  while(I.ai.i<chunks.length&&!I.ai.paused&&S.imp===I){
    const c=chunks[I.ai.i],main=c.map(pg=>`[page ${pg.p}]\n`+pg.lines.join('\n')).join('\n'),next=chunks[I.ai.i+1]?chunks[I.ai.i+1][0].lines.join('\n').slice(0,2500):'';
    I.prog=I.ai.i;I.msg=`Pages ${c[0].p}–${c[c.length-1].p} (part ${I.ai.i+1} of ${chunks.length})`;render();
    if(c.every(pg=>pg.lines.join('').trim().length<30)){I.ai.results.push({src:'',r:{questions:[],answer_key:[]},pages:c.map(pg=>pg.p)});I.ai.i++;continue}
    const prompt=`You are copying multiple-choice questions out of a printed question book so they can be studied. Copy ONLY what is printed in MAIN TEXT. Never write, complete, correct, paraphrase, summarise or guess anything. If an answer or explanation is not printed, leave it empty.

Return JSON only, in this shape:
{"questions":[{"num":12,"topic":"chapter or section heading in force","page":34,"stem":"question text exactly as printed","options":["option text without its letter","..."],"answer":["B"],"explanation":"printed explanation or empty"}],
 "answer_key":[{"num":12,"topic":"...","page":80,"answer":["B"],"explanation":"printed explanation or empty"}],
 "last_topic":"the heading in force at the end of MAIN TEXT"}

Rules:
- Include a question only if it STARTS inside MAIN TEXT. If it continues into FOLLOWING TEXT, finish copying it from there.
- Skip any fragment at the very top of MAIN TEXT whose beginning is not shown.
- "answer" lists the printed correct letter(s) only when they are printed next to the question; otherwise [].
- Put answer-list entries printed separately from their questions (answer sections, answer keys, explanation sections) in "answer_key".
- Keep the printed question numbers. Use the page markers for "page".
- Heading in force at the start: ${JSON.stringify(I.ai.lastTopic||I.defaultTopic)}.
- Copy text exactly, fixing only line-break hyphenation and spacing.

MAIN TEXT:
<<<
${main}
>>>

FOLLOWING TEXT (only for finishing a question that started in MAIN TEXT):
<<<
${next}
>>>`;
    try{

      I.log.push(`Pages ${c[0].p}–${c[c.length-1].p}: ${(r.questions||[]).length} questions, ${(r.answer_key||[]).length} answer entries`);I.ai.i++;

function aiAssemble(){
  const I=S.imp;const qs=[],ans=[];let sec=0,lastNum=0,lastKey=null,run=0,aLast=Infinity,aKey=null;const topics=new Map();
  const tkey=t=>{const m=/\b(chapter|unit|part|section|module)\s+([0-9]+|[IVXLC]+)\b/i.exec(t||'');return m?'c'+m[2].toUpperCase():normT(t)||'_'};
  const done=new Set();
  for(const {src,r,pages} of I.ai.results){
    for(const p of pages||[])done.add(p);
    for(const q of r.questions||[]){const key=tkey(q.topic);if(!topics.has(key))topics.set(key,(q.topic||I.defaultTopic).trim());
      if(key!==lastKey||+q.num<=lastNum)sec++;lastKey=key;lastNum=+q.num||lastNum+1;
      const opts=(q.options||[]).map(String);const okText=s=>!s||src.includes(normT(s).slice(0,60));
      const verified=okText(q.stem)&&opts.every(o=>src.includes(normT(o).slice(0,30)))&&(!q.explanation||src.includes(normT(q.explanation).slice(0,50)));
      qs.push({num:+q.num||lastNum,s:String(q.stem||''),o:opts,a:(q.answer||[]).length?[...new Set((q.answer||[]).map(x=>String(x).toUpperCase().trim()[0]))]:null,e:String(q.explanation||''),p:+q.page||(pages||[])[0]||0,key,sec,issues:[],unverified:!verified})}
    for(const a of r.answer_key||[]){const key=tkey(a.topic);if(key!==aKey||+a.num<=aLast)run++;aKey=key;aLast=+a.num;
      const ex=String(a.explanation||'');ans.push({num:+a.num,a:[...new Set((a.answer||[]).map(x=>String(x).toUpperCase().trim()[0]))],e:ex&&src.includes(normT(ex).slice(0,50))?ex:'',key,run,p:+a.page||(pages||[])[0]||0})}
  }
  const matched=bindAI(qs,ans);
  I.failedPages=new Set(I.ai.failed);for(const pg of I.pages)if(!done.has(pg.p))I.failedPages.add(pg.p);
  const stats=new Map();for(const pg of I.pages){const chars=pg.lines.join('').trim().length;stats.set(pg.p,{chars,unused:chars,ans:0})}
  for(const q of qs){const s=stats.get(q.p);if(s)s.unused=0}for(const a of ans){const s=stats.get(a.p);if(s){s.ans++;s.unused=0}}
  const LTs='ABCDEFGHIJ';
  I.result={questions:qs.map(q=>{const a=(q.a||[]).map(l=>LTs.indexOf(l)).filter(i=>i>=0&&i<q.o.length);const issues=[...q.issues];if(q.o.length<2)issues.push('Fewer than two options');if(!a.length)issues.push('No answer found');
    return{num:q.num,s:q.s.replace(/\s+/g,' ').trim(),o:q.o.map(x=>x.replace(/\s+/g,' ').trim()),a,e:q.e.replace(/\s+/g,' ').trim(),p:q.p,topic:topics.get(q.key)||I.defaultTopic,issues,unverified:q.unverified}}),
    topics:[...new Set(qs.map(q=>topics.get(q.key)||I.defaultTopic))],answerEntries:ans.length,unmatchedAns:ans.length-matched,pageStats:[...stats]};
  I.excluded=new Set();I.step='review';I.revPage=0;render();
}
function bindAI(qs,ans){let matched=0;
  const secs=new Map();qs.forEach((q,i)=>{let s=secs.get(q.sec);if(!s){s={key:q.key,map:new Map(),used:false};secs.set(q.sec,s)}if(!s.map.has(q.num))s.map.set(q.num,i)});
  const runs=new Map();for(const a of ans){let r=runs.get(a.run);if(!r){r={key:a.key,list:[]};runs.set(a.run,r)}r.list.push(a)}
  for(const r of runs.values()){let best=null;
    for(const pass of[0,1]){for(const s of secs.values()){if(s.used||pass===0&&s.key!==r.key)continue;let h=0;for(const a of r.list)if(s.map.has(a.num))h++;if(h/r.list.length>=0.6){best=s;break}}if(best)break}
    if(!best)continue;best.used=true;
    for(const a of r.list){const i=best.map.get(a.num);if(i===undefined)continue;matched++;const q=qs[i];if(!q.a||!q.a.length)q.a=a.a;else if(a.a.join()!==q.a.join())q.issues.push('Answer key disagrees with inline answer');if(a.e&&!q.e)q.e=a.e}}
  return matched;
}

function impPlan(){

async function impSave(){

  if(!S.on||navigator.onLine===false)return impSaveOffline();
  const P=I.plan,todo=P.blocks.filter(b=>b.st!=='ok');
  I.step='saving';I.prog=P.blocks.length-todo.length;I.progMax=P.blocks.length;I.msg='Uploading question blocks…';render();
  let stop=null;
  for(const blk of todo){
    if(stop){blk.st='fail';blk.err=stop;continue}
    try{await C().putChunk(blk.id,{bookId:P.book.id,n:blk.n,v:1,qs:blk.qs,updatedAt:now()});blk.st='sent';blk.err=null}
    catch(e){blk.st='fail';blk.err=e.code||e.message;if(e.code==='quota_exceeded'||e.code==='revoked')stop=blk.err}

        blk.st='ok';const c={bookId:P.book.id,n:blk.n,v:1,qs:blk.qs,updatedAt:now(),id:blk.id};M.chunks.set(blk.id,c);await IDB.put('chunks',blk.id,c).catch(()=>{})}

const FIGQ={want:new Set(),t:null,busy:false};

function figWant(id){FIGQ.want.add(id);clearTimeout(FIGQ.t);FIGQ.t=setTimeout(()=>figFetch([...FIGQ.want]).catch(()=>{}),60)}
async function figFetch(ids){ids=ids.filter(id=>figNeed(M.Q.get(id)));for(const id of ids)FIGQ.want.delete(id);if(!ids.length)return;
  if(!S.on){figPaint(ids);return}
  const want=new Set(ids),pairs=[];for(const c of M.chunks.values())for(const q of c.qs||[])if(want.has(q.id))pairs.push([c.id,q.id]);
  for(let i=0;i<pairs.length;i+=20){let got={};try{got=await gas('api_img',pairs.slice(i,i+20))||{}}catch(e){console.warn('img',e)}
    const touched=new Set();for(const [cid,qid] of pairs.slice(i,i+20)){const im=got[qid];if(!im||!im.length)continue;const c=M.chunks.get(cid);const x=c&&(c.qs||[]).find(q=>q.id===qid);if(x){x.img=im;touched.add(cid)}const q=M.Q.get(qid);if(q)q.img=im}
    for(const cid of touched){const c=M.chunks.get(cid);if(c)await IDB.put('chunks',cid,c).catch(()=>{})}}
  figPaint(ids)}
function figPaint(ids){for(const id of ids){const q=M.Q.get(id);for(const el of document.querySelectorAll(`[data-figq="${CSS.escape(id)}"]`))el.outerHTML=figNeed(q)?`<div class="figs" data-figq="${esc(id)}"><span class="small muted">${S.on?'The figure could not be loaded. Open the question again to retry.':'The figure loads when you are online.'}</span></div>`:figHTML(q)}}

function figHTML(q){if(figNeed(q)){figWant(q.id);return`<div class="figs" data-figq="${esc(q.id)}"><span class="small muted">${S.on?'Loading the figure\u2026':'The figure loads when you are online.'}</span></div>`}return q.img&&q.img.length?`<div class="figs">${q.img.map((src,k)=>/^data:image\/(?:jpeg|png);base64,[A-Za-z0-9+/=]+$/.test(src)?`<img data-a="figzoom" title="Tap to enlarge" src="${src}" alt="Figure or table from the book${q.p?', page '+q.p:''}${q.img.length>1?' (part '+(k+1)+')':''}" loading="lazy">`:'').join('')}</div>`:''}

  for(const r of rs){const m=unrle(r.map);for(let i=0;i<m.length;i++){const p=r.from+i-1;if(p>=0&&p<T&&COV[m[i]].rank>COV[arr[p]].rank)arr[p]=m[i]}}

async function verifyBook(id){

function downloadLocal(name,text){

}
async function backup(kind,local){
  const data={app:'mcq-vault',version:1,kind,exportedAt:now(),logs:[...M.logs.values()].map(d=>({...cloudBody(d),id:d.id}))};
  if(kind==='full'){data.books=[...M.books.values()];data.chunks=[...M.chunks.values()]}
  const name=`mcq-vault-${kind}-${dayKey(now())}.json`,text=JSON.stringify(data);
  try{
    if(local||!Cloud.mode){downloadLocal(name,text);toast('Download started. If nothing appears, use the Drive backup instead.')}
    else{const r=await C().saveFile(name,text);toast(r.where==='Drive'?'Backup saved to the backups folder in your Drive':'Backup saved')}
    S.lastBackup=now();kvPut('lastBackup',S.lastBackup);render();
  }catch(e){toast(e.code==='declined'?'Backup not saved':e.code==='too_large'?'Too large for one file. Save a progress backup instead.':'Could not save: '+(e.message||e.code))}
}
async function restore(file){
  try{const data=JSON.parse(await file.text());if(data.app!=='mcq-vault')throw new Error('not an MCQ Vault backup');
    let added=0;for(const l of data.logs||[]){const before=M.logs.get(l.id)?Object.keys(M.logs.get(l.id).at).length:0;mergeLog(l.id,l);const after=Object.keys(M.logs.get(l.id).at).length;if(after>before){added+=after-before;S.pending.add(l.id);M.logs.get(l.id).updatedAt=now()}}
    let nb=0;if(data.books&&S.on){for(const b of data.books){if(M.books.has(b.id))continue;for(const c of (data.chunks||[]).filter(c=>c.bookId===b.id)){const{id,...body}=c;await C().putChunk(id,body);M.chunks.set(id,c);await IDB.put('chunks',id,c).catch(()=>{})}await saveBook({...b,updatedAt:now()});nb++}}
    rebuildQ();rebuildAtt();await savePending();scheduleFlush(300);toast(`Restored ${nf(added)} answers${nb?` and ${nb} book${nb>1?'s':''}`:''}. Nothing was removed.`,6000);render();
  }catch(e){toast('Could not restore: '+(e.message||e))}
}
async function rebuildCache(){

}

/* ================= Deep Focus: textbooks to search and study from =================
   A textbook's text is read once from the PDF and kept on this device (IndexedDB "mcq-vault-focus")
   and in Drive (kinds tbooks + tpages), so every device can search it. The PDF file itself stays only on
   the device that added it, for page pictures. Notebook items sync as one merged doc (focus/notes).
   Search, reading, key points, flashcards, concept maps and sketches need nothing else; the Claude tools
   use the optional ANTHROPIC_API_KEY (billed by Anthropic per use, not part of a Claude subscription). */
const Focus=(()=>{
  const F={wanted:false,tbs:new Map(),pages:new Map(),idx:null,idxKey:'',building:null,notes:{items:{}},sk:new Map(),pdf:new Map(),files:new Set(),dl:'',syncing:false,booted:false};
  const FX_TEXT=false; // textbooks (upload, search, pages) are switched off since 18 Nov 2026; true brings them back
  const FX=()=>S.fx||(S.fx={tab:'saved',q:'',tb:'',qid:null,topic:null,terms:null,res:null,more:false,set:[],read:null,out:null,nbType:'all',nbQ:'',add:null});
  const cloudOK=()=>S.on&&Cloud.mode==='gas';
  const FC={put:(k,id,o)=>gas('api_put',k,id,o),get:(k,ids)=>gas('api_get',k,ids),del:(k,id)=>gas('api_del',k,id),list:()=>gas('api_focus')};

  /* ---------- local store (its own database, so the main one never needs an upgrade) ---------- */
  const DB={db:null,
    open(){return new Promise(res=>{try{const r=indexedDB.open('mcq-vault-focus'+accDb(),1);r.onupgradeneeded=()=>{const d=r.result;for(const s of['pages','files','kv'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s)};
      r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})},
    req(s,mode,fn){if(!this.db)return Promise.resolve(undefined);return new Promise((res,rej)=>{try{const t=this.db.transaction(s,mode);const q=fn(t.objectStore(s));t.oncomplete=()=>res(q&&'result'in q?q.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}catch(e){rej(e)}})},
    get(s,k){return this.req(s,'readonly',o=>o.get(k)).catch(()=>undefined)},
    put(s,k,v){return this.req(s,'readwrite',o=>o.put(v,k)).catch(e=>{console.warn('focus save',e)})},
    del(s,k){return this.req(s,'readwrite',o=>o.delete(k)).catch(()=>{})},
    keys(s){return this.req(s,'readonly',o=>o.getAllKeys()).catch(()=>[])}};
  const saveMetas=()=>DB.put('kv','tbooks',[...F.tbs.values()]);
  const saveNotesLocal=()=>DB.put('kv','notes',F.notes);

  /* ---------- words ---------- */

  /* ---------- printed page numbers and book references in explanations ---------- */

  /* ---------- reading a textbook PDF ---------- */

      for(const it of tc.items){const s=it.str;if(!s)continue;const tr=it.transform,h=Math.abs(tr[3])||Math.abs(tr[0])||it.height||8;const v=vp.convertToViewportPoint(tr[4],tr[5]),x=v[0],y=v[1];

  async function outline(doc){const out=[];let ol=null;try{ol=await doc.getOutline()}catch(e){}if(!ol)return out;

  /* ---------- adding, syncing and removing textbooks ---------- */

  async function addBook(){

  async function upload(id){const tb=F.tbs.get(id);if(!tb||!tb.local||!cloudOK()||tb._up)return;tb._up=true;

  /* ---------- study set: the passages the tools work on ---------- */
  function studySet(){const X=FX(),I=F.idx;if(!I)return[];

  function setLabel(){const X=FX();if(X.read){const tb=F.tbs.get(X.read.tb);return`page ${label(tb,X.read.p)} of ${tb?.name||''}`}return X.set.length?`the ${X.set.length} passage${X.set.length>1?'s':''} you ticked`:'the top 3 results'}
  function ctxTitle(){const X=FX();if(X.qid){const q=M.Q.get(X.qid);return q?q.s.slice(0,90):'Question'}if(X.topic)return X.topic;if(X.read){const tb=F.tbs.get(X.read.tb);const P=studySet()[0];return(P&&(P.h||P.sec||P.ch))||`${tb?.name} p.${label(tb,X.read.p)}`}return X.q||'Study notes'}
  const srcOf=list=>{const seen=new Set(),out=[];for(const P of list){const k=P.tb+':'+P.p;if(!seen.has(k)){seen.add(k);out.push({tb:P.tb,p:P.p})}}return out};
  const activeT=()=>new Set((FX().terms||[]).filter(x=>x.on).map(x=>x.t));

  /* ---------- tools that need no key ---------- */
  const CUE=/\b(?:most common|commonest|first[- ]line|treatment of choice|drug of choice|characteri[sz]ed by|defined as|definition|hallmark|pathognomonic|classic(?:al)?|associated with|risk factors?|prevalence|incidence|lifetime|onset|caused by|due to|results? in|diagnos(?:is|ed|tic)|criteria|contraindicat|side effects?|adverse|toxicity|mechanism|differential|prognosis|better|worse|increases?|decreases?|always|never|only|key|important)\b/gi;
  function sentences(list){const out=[];for(const P of list)for(const para of P.t.split(/\n{2,}/)){if(para.startsWith('# '))continue;
    for(const s of para.split(/(?<=[.!?])\s+(?=[A-Z(\d])/)){const t=s.trim();if(t.length>=40&&t.length<=420)out.push({t,tb:P.tb,p:P.p})}}return out}
  function scoreSent(s,q){const tk=toks(s.t);if(!tk.length)return 0;let v=0;const seen=new Set();for(const w of tk){if(seen.has(w))continue;seen.add(w);v+=idf(w)*(q.has(w)?2.2:.35)}
    const cue=Math.min(3,(s.t.match(CUE)||[]).length);return v/Math.sqrt(tk.length+4)+cue*1.1+(/\d/.test(s.t)?.4:0)}
  function keyPoints(list,n=9){const q=activeT();const ss=sentences(list).map((s,i)=>({...s,i,v:scoreSent(s,q)}));const pick=[];
    for(const s of ss.slice().sort((a,b)=>b.v-a.v)){if(pick.length>=n)break;const a=new Set(toks(s.t));if(pick.some(x=>{const b=new Set(toks(x.t));let c=0;for(const w of a)if(b.has(w))c++;return c/Math.max(1,Math.min(a.size,b.size))>.6}))continue;pick.push(s)}
    return pick.sort((a,b)=>a.i-b.i)}
  function lists(list){const out=[];const re=/(?:include|includes|including|are|such as|consists? of|comprises?|namely)[:\s]+([^.;:]{6,}?,[^.;:]+?(?:,|\band\b|\bor\b)[^.;:]+)/gi;
    for(const s of sentences(list)){let m;re.lastIndex=0;while((m=re.exec(s.t))){const it=m[1].split(/,\s*(?:and|or)?\s*|\s+(?:and|or)\s+/).map(x=>x.replace(/^(?:the|a|an)\s+/i,'').trim()).filter(x=>x&&x.length<60);
      if(it.length>=3&&it.length<=9&&!out.some(o=>o.items.join()===it.join()))out.push({items:it,tb:s.tb,p:s.p,s:s.t})}}return out.slice(0,6)}
  // the word worth hiding: a term the book uses more than once, drug and disease names, numbers with units; not plain adjectives or verbs
  function blankScore(x,t,q){const e=F.idx&&F.idx.post.get(x.t),df=e?e.ids.length:0,l=x.w.toLowerCase();let v=Math.min(idf(x.t),6)-(df<2?2.5:0)-(q.has(x.t)?.6:0);
    if(/\d/.test(x.w))v+=/^\s*(?:%|percent|mg|mEq|years?|weeks?|days?|hours?|times)/i.test(t.slice(x.i+x.w.length))?2.5:-2;
    if(/(?:ine|ide|ole|pam|lam|one|ate|azine|xetine|pine|done|itis|osis|emia|algia|ism|oma|pathy|plasia|trophy|cytes?)$/.test(l))v+=1.5;
    if(/(?:ly|ous|ful|able|ible|ed|ing|ive|al)$/.test(l))v-=1.5;if(/^[A-Z][a-z]/.test(x.w)&&x.i>0)v+=.5;return v}
  function cards(list){const q=activeT();const out=[];
    for(const s of keyPoints(list,16)){const ws=toksS(s.t).filter(x=>x.w.length>=4&&!/^\d+$/.test(x.w)||/^\d+(?:\.\d+)?$/.test(x.w)&&/%|percent|times|fold|mg|years?/.test(s.t.slice(x.i,x.i+x.w.length+12)));
      if(!ws.length)continue;ws.sort((a,b)=>blankScore(b,s.t,q)-blankScore(a,s.t,q));const w=ws[0];
      out.push({f:s.t.slice(0,w.i)+'_____'+s.t.slice(w.i+w.w.length),b:w.w,s:s.t,tb:s.tb,p:s.p});if(out.length>=12)break}
    return out}
  function conceptMap(list,center){const q=activeT();const ss=sentences(list);const units=new Map();
    for(const s of ss){const tk=toksS(s.t);const has=tk.some(x=>q.has(x.t));const seen=new Set();
      const add=(k,w,sc)=>{if(seen.has(k))return;seen.add(k);let u=units.get(k);if(!u)units.set(k,u={k,w,n:0,c:0,ex:null,sc});u.n++;if(has){u.c++;if(!u.ex||s.t.length<u.ex.t.length)u.ex=s}};
      for(let i=0;i<tk.length;i++){const a=tk[i];if(q.has(a.t)||/^\d/.test(a.t))continue;add(a.t,a.w,idf(a.t));
        const b=tk[i+1];if(b&&!q.has(b.t)&&!/^\d/.test(b.t)&&s.t.slice(a.i+a.w.length,b.i).trim()==='')add(a.t+' '+b.t,a.w+' '+b.w,(idf(a.t)+idf(b.t))*.6)}}
    const vague=new Set('present level cause include use increase decrease reduce risk common type case effect result indicate require show occur consist treat patient sign symptom part note further people may lead seen'.split(' ').map(stem));
    let cand=[...units.values()].filter(u=>u.c>0&&(u.k.includes(' ')?u.n>=2:!vague.has(u.k))).map(u=>({...u,v:u.c*u.sc*(u.k.includes(' ')?1.4:1)})).sort((a,b)=>b.v-a.v);
    const pick=[];for(const u of cand){if(pick.length>=8)break;const parts=u.k.split(' ');if(pick.some(p=>p.k.split(' ').some(x=>parts.includes(x))))continue;pick.push(u)}
    return{center,nodes:pick.map(u=>({w:u.w.toLowerCase(),ex:u.ex}))}}

  const AI={

    diag:{t:'Diagram',ask:'Turn the main idea of these excerpts into one simple diagram a student could sketch from memory: a flowchart (steps, pathways, causes leading to effects, decision steps) with at most 12 boxes of at most 6 words each, or a comparison table if the content is a comparison.',shape:'{"title":"...","kind":"flow or table","nodes":[{"id":"a","label":"..."}],"edges":[{"from":"a","to":"b","label":"optional, 1-3 words"}],"columns":["only for a table"],"rows":[["only for a table"]],"page":"12"}'},

    expl:{t:'Explain this question',ask:'Explain the question below using only these textbook excerpts: why the keyed answer is right, and briefly why each other option is wrong. Quote the deciding fact and give its page. If the excerpts do not settle it, say so plainly.',shape:'{"why_correct":"...","why_not":[{"option":"A","why":"..."}],"key_fact":"short quote","page":"12","settled":true}'}};

  /* ---------- rendering helpers ---------- */
  function hl(text,set){let out='',last=0;const re=/[A-Za-z0-9\u00c0-\u024f]+/g;let m;while((m=re.exec(text))){const l=norm(m[0]);if(set.has(stem(l))&&!STOP.has(l)){out+=esc(text.slice(last,m.index))+'<mark>'+esc(m[0])+'</mark>';last=m.index+m[0].length}}return out+esc(text.slice(last))}
  function snippet(t,set,len=360){const flat=t.replace(/^# .*$/gm,'').replace(/\s+/g,' ').trim();if(flat.length<=len)return flat;
    const pos=[];const re=/[A-Za-z0-9]+/g;let m;while((m=re.exec(flat)))if(set.has(stem(norm(m[0]))))pos.push(m.index);
    let best=0,bc=-1;for(const p of pos){let c=0;for(const q of pos)if(q>=p-40&&q<p+len-40)c++;if(c>bc){bc=c;best=p}}
    let a=Math.max(0,best-60);const sp=flat.lastIndexOf(' ',a);if(a>0&&sp>0)a=sp+1;const e=Math.min(flat.length,a+len);return(a>0?'\u2026 ':'')+flat.slice(a,e)+(e<flat.length?' \u2026':'')}

  function weakTopics(){const m=new Map();for(const q of M.Q.values())for(const t of q.sub||[]){if(t==='Other')continue;const x=m.get(t)||{name:t,n:0,seen:0,w:0,bank:0,ok:0,tries:0};x.n++;const s=M.qs.get(q.id);if(s){x.seen++;x.tries+=s.n;x.ok+=s.c;if(s.w)x.w++;if(s.bank)x.bank++}m.set(t,x)}
    return[...m.values()].sort((a,b)=>b.bank-a.bank||b.w-a.w||(a.tries?a.ok/a.tries:1)-(b.tries?b.ok/b.tries:1)||b.n-a.n)}

    if(!F.idx||F.idxKey!==idxKey()){ready();return head+`<div class="empty"><h3>Preparing your textbooks for search\u2026</h3><p class="small">This takes a few seconds the first time the app opens.</p></div>`}
    if(X.tab==='topics')return head+viewTopics();
    if(X.tab==='notes')return head+viewNotes();
    return head+(X.read?viewReader():viewSearch());
  }
  function setTab(v){const X=FX();if(!FX_TEXT&&v!=='saved'&&v!=='notes')v='saved';if(v==='text')v=X.lastText||'search';if(['search','topics','books'].includes(v))X.lastText=v;X.tab=v}
  function toolbar(){const X=FX(),ai=Cloud.ai;const b=(k,l,dis)=>`<button class="btn sm" data-f="tool" data-k="${k}" ${dis?'disabled':''}>${l}</button>`;

  function viewSearch(){
    const X=FX(),books=live();const set=activeT();const q=X.qid?M.Q.get(X.qid):null;
    const form=`<form class="row" id="fxform" onsubmit="return false"><input type="search" id="fxq" placeholder="Search your textbooks, e.g. lithium toxicity" value="${esc(X.q)}" style="flex:3;min-width:200px" aria-label="Search your textbooks">
      ${books.length>1?`<select id="fxtb" style="flex:1;min-width:150px" aria-label="Which textbook"><option value="">All textbooks</option>${books.map(b=>`<option value="${b.id}" ${X.tb===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select>`:''}

    else if(X.topic){const tqs=topicQs(X.topic);const wrong=tqs.filter(q=>{const s=M.qs.get(q.id);return s&&s.w});const tw=new Set(toks(X.topic));
      const chs=[];for(const tb of books)for(const e of tb.toc||[])if(toks(e.t).some(w=>tw.has(w)))chs.push({tb,e});

      <p class="small muted">${nf(tqs.length)} questions on this topic in your vault${wrong.length?`, ${nf(wrong.length)} you have got wrong`:''}. The passages below match what those questions ask about.</p>

      ${wrong.length?`<details><summary class="small">Questions on this topic you got wrong (${nf(wrong.length)})</summary><div class="stack" style="margin-top:8px">${wrong.slice(0,30).map(q=>`<div class="fxmini"><span>${esc(q.s.slice(0,180))}${q.s.length>180?'\u2026':''}</span><button class="btn sm" data-f="fromQ" data-id="${q.id}">Find in textbook</button></div>`).join('')}</div></details>`:''}</div>`}
    const chips=X.terms&&X.terms.length&&(X.qid||X.topic)?`<div class="row fxchips"><span class="small muted">Searched for</span>${X.terms.map((t,i)=>`<button class="chip ${t.on?'on':''}" data-f="term" data-i="${i}" aria-pressed="${t.on}">${esc(t.label)}</button>`).join('')}<span class="small muted">Tap a word to leave it out.</span></div>`:'';

        return`<article class="fxres ${on?'on':''}"><div class="qmeta">${where(P)}</div>${P.h?`<b class="fxh">${esc(P.h)}</b>`:''}<p class="fxsnip">${hl(snippet(P.t,set),set)}</p>
          <div class="row" style="justify-content:space-between"><label class="chk small"><input type="checkbox" data-f="pick" data-k="${r.id}" ${on?'checked':''}> Add to study set</label><button class="btn sm" data-f="read" data-tb="${P.tb}" data-p="${P.p}" data-pi="${r.id}">Read page \u2192</button></div></article>`}).join('')}
        ${X.res.length>12&&!X.more?`<button class="btn" data-f="more">Show more results (${Math.min(60,X.res.length)-12})</button>`:''}</div>`
        :`<div class="notice">Nothing in your textbooks matches these words. Try fewer or different words.</div>`}
    else if(!q&&!X.topic)res=home();
    const tools=X.res&&X.res.length?(X.set.length?toolbar():`<p class="small muted fxhint">Tick \u201cAdd to study set\u201d on a ${q?'page':'passage'}, or open a page, to get the study tools: key points, flashcards, concept map, sketch pad and notes.</p>`):'';
    return form+ctx+chips+tools+outHTML()+res;
  }
  function relPages(q){const X=FX(),I=F.idx;const out=[],seen=new Map();if(!I||!q)return out;
    const add=(tb,p,ids,s,ref)=>{const k=tb+':'+p;let e=seen.get(k);if(!e){e={tb,p,pi:null,s:0,ids:[],ref:null};seen.set(k,e);out.push(e)}
      for(const i of ids)if(!e.ids.includes(i))e.ids.push(i);if(e.pi==null&&ids.length)e.pi=ids[0];e.s=Math.max(e.s,s);if(ref)e.ref=ref};
    for(const r of bookRefs(q))add(r.tb,r.p,I.byPage.get(r.tb+':'+r.p)||[],Infinity,r.cite);
    const res=X.res||[],top=res.length?res[0].s:0;
    for(const r of res){if(r.s<top*.15||out.length>=40)break;const P=I.P[r.id];if(P)add(P.tb,P.p,[r.id],r.s)}
    return out}
  function relHTML(q){const X=FX(),I=F.idx,set=activeT();const pages=relPages(q);X.rel=pages.map(e=>({tb:e.tb,p:e.p,pi:e.pi}));

      <div class="stack">${shown.map((e,i)=>{const P=I.P[e.pi]||{tb:e.tb,p:e.p,t:'',h:''};const on=e.ids.length&&e.ids.every(k=>X.set.includes(k));
        return`<article class="fxres fxpage ${on?'on':''}"><div class="qmeta"><span class="pill num">${i+1}</span>${where(P)}${e.ref?`<span class="pill ok">Book reference</span>`:''}</div>${P.h?`<b class="fxh">${esc(P.h)}</b>`:''}${P.t?`<p class="fxsnip">${hl(snippet(P.t,set),set)}</p>`:''}
          ${e.ids.length>1?`<p class="small muted">${nf(e.ids.length)} matching passages on this page</p>`:''}
          <div class="row" style="justify-content:space-between">${e.ids.length?`<label class="chk small"><input type="checkbox" data-f="pickpg" data-k="${e.ids.join(',')}" ${on?'checked':''}> Add to study set</label>`:'<span></span>'}<button class="btn sm" data-f="rel" data-i="${i}">Read page \u2192</button></div></article>`}).join('')}
      ${pages.length>12&&!X.more?`<button class="btn" data-f="more">Show all ${nf(pages.length)} pages</button>`:''}</div>`}
  function home(){const w=weakTopics().filter(x=>x.w||x.bank).slice(0,6);const recent=items().slice(0,4);
    return`<div class="grid2"><div class="panel"><h3>Your weak spots</h3>${w.length?`<div class="stack" style="gap:8px">${w.map(x=>`<div class="spread"><span><b>${esc(x.name)}</b> <span class="small muted">${nf(x.w)} got wrong${x.bank?` \u00b7 ${nf(x.bank)} in the wrong bank`:''}</span></span><button class="btn sm" data-f="topic" data-k="${esc(x.name)}">Study</button></div>`).join('')}</div>`:'<p class="small muted">Answer some questions first. Topics you get wrong show up here to study from your textbooks.</p>'}</div>
      <div class="panel"><h3>Recent notes</h3>${recent.length?recent.map(it=>`<div class="spread"><span><span class="pill">${esc(TYPE[it.type]||it.type)}</span> ${esc(it.title||'')}</span></div>`).join('')+`<button class="btn sm" data-f="tab" data-v="notes">Open notebook</button>`:'<p class="small muted">Key points, flashcards, sketches and notes you save appear here.</p>'}</div></div>

  function viewReader(){
    const X=FX(),R=X.read,tb=F.tbs.get(R.tb),pages=F.pages.get(R.tb);if(!tb||!pages){X.read=null;return viewSearch()}

  const TYPE={note:'Note',keys:'Key points',cards:'Flashcards',map:'Concept map',sketch:'Sketch',ai:'Claude',sum:'Summary',mnem:'Mnemonics',diag:'Diagram',quiz:'Practice questions',expl:'Explanation'};
